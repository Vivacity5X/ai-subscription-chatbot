<!DOCTYPE html>
<html>
<head>
    <title>Subscription Chatbot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="chat-container">
    <h2>💬 Subscription Chatbot</h2>

    <div id="chat-box"></div>

<input type="text" id="user-input" placeholder="Type a message..."
       onkeydown="if(event.key==='Enter') sendMessage()"/>
    <button onclick="sendMessage()">Send</button>
</div>

<script>
    window.onload = function () {
    let chatBox = document.getElementById("chat-box");
    chatBox.innerHTML += `<div class="bot">Bot: 👋 Welcome! Type "show plans" to begin.</div>`;
};

function sendMessage() {
    let msg = document.getElementById("user-input").value;
    if (!msg) return;

    let chatBox = document.getElementById("chat-box");
let time = new Date().toLocaleTimeString();
chatBox.innerHTML += `<div class="user"><small>${time}</small><br>You: ${msg}</div>`;

    fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: msg})
    })
    .then(res => res.json())
    .then(data => {
chatBox.innerHTML += `<div class="bot"><small>${time}</small><br>Bot: ${data.reply}</div>`;
    });

    chatBox.scrollTop = chatBox.scrollHeight;

    document.getElementById("user-input").value = "";
}
</script>

</body>
</html>
